<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat App</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            padding: 36px 40px;
            width: 100%;
            max-width: 480px;
        }
        .container.wide { max-width: 780px; }
        h2 { font-size: 22px; color: #1a1a1a; margin-bottom: 20px; }
        input[type="email"],
        input[type="password"],
        input[type="text"] {
            width: 100%;
            padding: 10px 14px;
            margin: 6px 0 14px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus { border-color: #4f46e5; }
        label { font-size: 13px; color: #374151; font-weight: 500; }
        button[type="submit"] {
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 10px 20px;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
            margin-top: 4px;
            transition: background 0.2s;
        }
        button[type="submit"]:hover { background: #4338ca; }
        .error {
            background: #fef2f2;
            border: 1px solid #fca5a5;
            color: #dc2626;
            border-radius: 6px;
            padding: 10px 14px;
            font-size: 13px;
            margin-bottom: 16px;
        }
        a { color: #4f46e5; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .link-row { text-align: center; margin-top: 16px; font-size: 13px; color: #6b7280; }
    </style>
</head>
<body>
{% block content %}{% endblock %}
</body>
</html>
